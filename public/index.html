<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
/>

<title>Strategy Line Pro</title>

<script src="/socket.io/socket.io.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{

--bg:#050816;
--card:#0f172a;
--primary:#2563eb;
--green:#22c55e;
--red:#ef4444;
--muted:#94a3b8;

}

*{

margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
user-select:none;

}

html,body{

width:100%;
height:100%;
overflow:hidden;

font-family:'Inter',sans-serif;

background:
radial-gradient(circle at top,#10214d 0%,#050816 60%);

color:white;

}

body{

display:flex;
justify-content:center;
align-items:center;
padding:14px;

}

.container{

width:100%;
max-width:430px;

background:
linear-gradient(
180deg,
#0f172a,
#0b1222
);

border-radius:28px;

padding:20px;

border:1px solid rgba(255,255,255,.05);

box-shadow:
0 20px 60px rgba(0,0,0,.6),
0 0 30px rgba(37,99,235,.15);

}

.logo{

text-align:center;
margin-bottom:18px;

}

.logo h1{

font-family:'Orbitron',sans-serif;
font-size:28px;
letter-spacing:2px;

}

.logo p{

margin-top:6px;
font-size:13px;
color:var(--muted);

}

.status{

padding:14px;
border-radius:18px;
font-weight:700;
text-align:center;
margin-bottom:18px;

background:rgba(37,99,235,.15);

border:1px solid rgba(37,99,235,.3);

}

.board-wrap{

background:#07101f;
border-radius:24px;
padding:12px;

}

.board{

width:100%;
display:block;
touch-action:none;

}

.line{

stroke:#334155;
stroke-width:4;
stroke-linecap:round;

}

.node{

fill:#162235;
stroke:#334155;
stroke-width:2;

transition:.15s;

cursor:pointer;

}

.node:active{

transform:scale(.92);

}

.node.p1{

fill:var(--green);
stroke:white;

filter:
drop-shadow(
0 0 10px
rgba(34,197,94,.7)
);

}

.node.p2{

fill:var(--red);
stroke:white;

filter:
drop-shadow(
0 0 10px
rgba(239,68,68,.7)
);

}

.node.selected{

stroke:#facc15;
stroke-width:5;

}

.hint{

fill:#60a5fa;

opacity:.55;

animation:pulse 1s infinite;

}

@keyframes pulse{

0%{
opacity:.2;
}

50%{
opacity:.8;
}

100%{
opacity:.2;
}

}

.controls{

margin-top:18px;

display:grid;
grid-template-columns:1fr 1fr;
gap:10px;

}

.btn{

padding:14px;

border:none;
border-radius:16px;

font-weight:700;
cursor:pointer;

font-size:14px;

}

.primary{

background:#2563eb;
color:white;

}

.secondary{

background:#1e293b;
color:white;

}

.bottom{

margin-top:16px;

display:flex;
justify-content:space-between;
align-items:center;

}

.phase{

font-size:13px;
color:var(--muted);

}

.quit{

padding:10px 16px;

border:none;
border-radius:14px;

background:#2a1010;
color:#ffb4b4;

font-weight:700;
cursor:pointer;

}

.popup{

position:fixed;
inset:0;

background:rgba(0,0,0,.7);

display:flex;
justify-content:center;
align-items:center;

z-index:999;

}

.popup-card{

width:90%;
max-width:320px;

background:#0f172a;

padding:28px;

border-radius:24px;

text-align:center;

}

.popup-title{

font-size:24px;
font-weight:800;
margin-bottom:10px;

}

.popup-text{

color:var(--muted);
margin-bottom:22px;

}

.popup-btn{

width:100%;

padding:15px;

border:none;
border-radius:14px;

background:#2563eb;
color:white;

font-weight:700;
cursor:pointer;

}

.speaking{

animation:speakingPulse 1s infinite;

}

@keyframes speakingPulse{

0%{
box-shadow:0 0 0 0 rgba(37,99,235,.7);
}

70%{
box-shadow:0 0 0 18px rgba(37,99,235,0);
}

100%{
box-shadow:0 0 0 0 rgba(37,99,235,0);
}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<h1>STRATEGY LINE</h1>

<p>Realtime Multiplayer Voice Game</p>

</div>

<div
id="status"
class="status">

Connecting...

</div>

<div class="board-wrap">

<svg
class="board"
viewBox="0 0 300 300">

<line class="line" x1="50" y1="50" x2="250" y2="50"/>
<line class="line" x1="50" y1="150" x2="250" y2="150"/>
<line class="line" x1="50" y1="250" x2="250" y2="250"/>

<line class="line" x1="50" y1="50" x2="50" y2="250"/>
<line class="line" x1="150" y1="50" x2="150" y2="250"/>
<line class="line" x1="250" y1="50" x2="250" y2="250"/>

<line class="line" x1="50" y1="50" x2="250" y2="250"/>
<line class="line" x1="250" y1="50" x2="50" y2="250"/>

<g id="nodes"></g>

</svg>

</div>

<div class="controls">

<button
id="micBtn"
class="btn primary">

MIC ON

</button>

<button
id="speakerBtn"
class="btn secondary">

SPEAKER ON

</button>

</div>

<div class="bottom">

<div
id="phase"
class="phase">

Placing Phase

</div>

<button
class="quit"
onclick="location.reload()">

QUIT

</button>

</div>

</div>

<audio
id="remoteAudio"
autoplay
playsinline>
</audio>

<script>

/* =====================================
URL
===================================== */

const params =
new URLSearchParams(
location.search
);

const roomId =
params.get("room");

const player =
params.get("player");

const groupId =
params.get("group");

if(
!roomId ||
!player ||
!groupId
){

document.body.innerHTML = `

<div style="

height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

font-family:sans-serif;
background:#050816;
color:white;

">

<h1>STRATEGY LINE</h1>

<p>
Open from Telegram bot
</p>

</div>

`;

throw new Error(
"Invalid URL"
);

}

/* =====================================
SOCKET
===================================== */

const socket = io();

/* =====================================
DOM
===================================== */

const statusEl =
document.getElementById(
'status'
);

const nodesEl =
document.getElementById(
'nodes'
);

const phaseEl =
document.getElementById(
'phase'
);

const micBtn =
document.getElementById(
'micBtn'
);

const speakerBtn =
document.getElementById(
'speakerBtn'
);

const remoteAudio =
document.getElementById(
'remoteAudio'
);

/* =====================================
GAME
===================================== */

const positions = [

{x:50,y:50},
{x:150,y:50},
{x:250,y:50},

{x:50,y:150},
{x:150,y:150},
{x:250,y:150},

{x:50,y:250},
{x:150,y:250},
{x:250,y:250}

];

const adj = {

0:[1,3,4],
1:[0,2,4],
2:[1,5,4],

3:[0,4,6],
4:[0,1,2,3,5,6,7,8],
5:[2,4,8],

6:[3,7,4],
7:[6,8,4],
8:[5,7,4]

};

const wins = [

[0,1,2],
[3,4,5],
[6,7,8],

[0,3,6],
[1,4,7],
[2,5,8],

[0,4,8],
[2,4,6]

];

/* =====================================
STATE
===================================== */

let selected = null;

let moveLock = false;

let localStream;

let peer;

let micEnabled = true;

let speakerEnabled = true;

const myRole = player;

const state = {

board:Array(9).fill(null),

turn:'p1',

phase:'placing',

p1P:0,
p2P:0,

winner:null,

active:false

};

/* =====================================
HELPERS
===================================== */

function deep(obj){

return JSON.parse(
JSON.stringify(obj)
);

}

function popup(
title,
text
){

const div =
document.createElement(
'div'
);

div.className = 'popup';

div.innerHTML = `

<div class="popup-card">

<div class="popup-title">
${title}
</div>

<div class="popup-text">
${text}
</div>

<button class="popup-btn">
OK
</button>

</div>

`;

document.body.appendChild(
div
);

div.querySelector(
'button'
).onclick = ()=>{

div.remove();

};

}

function setStatus(text){

statusEl.innerText =
text;

}

function validateState(s){

if(!s) return false;

if(
!Array.isArray(s.board)
)return false;

if(
s.board.length !== 9
)return false;

return true;

}

/* =====================================
RENDER
===================================== */

function render(){

const frag =
document.createDocumentFragment();

for(
let i=0;
i<positions.length;
i++
){

const p =
positions[i];

const node =
document.createElementNS(
"http://www.w3.org/2000/svg",
"circle"
);

node.setAttribute(
'cx',
p.x
);

node.setAttribute(
'cy',
p.y
);

node.setAttribute(
'r',
15
);

node.classList.add(
'node'
);

if(
state.board[i]
){

node.classList.add(
state.board[i]
);

}

if(
selected === i
){

node.classList.add(
'selected'
);

}

node.addEventListener(

'pointerdown',

()=>tap(i),

{passive:true}

);

frag.appendChild(
node
);

if(

selected !== null &&

!state.board[i] &&

adj[selected]
.includes(i)

){

const hint =
document.createElementNS(
"http://www.w3.org/2000/svg",
"circle"
);

hint.setAttribute(
'cx',
p.x
);

hint.setAttribute(
'cy',
p.y
);

hint.setAttribute(
'r',
7
);

hint.classList.add(
'hint'
);

hint.addEventListener(

'pointerdown',

()=>tap(i),

{passive:true}

);

frag.appendChild(
hint
);

}

}

nodesEl.replaceChildren(
frag
);

if(state.winner){

setStatus(

state.winner === myRole
? "YOU WON"
: "YOU LOST"

);

}else{

setStatus(

state.turn === myRole
? "YOUR TURN"
: "WAITING FOR OPPONENT"

);

}

phaseEl.innerText =

state.phase === 'placing'
? "Placing Phase"
: "Moving Phase";

}

/* =====================================
WIN
===================================== */

function checkWin(){

for(const w of wins){

const[a,b,c] = w;

if(

state.board[a] &&

state.board[a] ===
state.board[b] &&

state.board[a] ===
state.board[c]

){

state.winner =
state.board[a];

}

}

}

/* =====================================
MOVE
===================================== */

function tap(i){

if(moveLock) return;

if(!state.active)
return;

if(state.turn !== myRole)
return;

if(state.winner)
return;

moveLock = true;

setTimeout(()=>{

moveLock = false;

},160);

navigator.vibrate?.(25);

/* placing */

if(
state.phase === 'placing'
){

if(state.board[i])
return;

state.board[i] =
myRole;

if(myRole === 'p1'){
state.p1P++;
}else{
state.p2P++;
}

if(
state.p1P === 3 &&
state.p2P === 3
){

state.phase =
'moving';

}

checkWin();

if(!state.winner){

state.turn =

state.turn === 'p1'
? 'p2'
: 'p1';

}

sync();

render();

return;

}

/* moving */

if(
state.board[i] === myRole
){

selected =

selected === i
? null
: i;

render();

return;

}

if(selected !== null){

if(

!state.board[i] &&

adj[selected]
.includes(i)

){

state.board[i] =
myRole;

state.board[selected] =
null;

selected = null;

checkWin();

if(!state.winner){

state.turn =

state.turn === 'p1'
? 'p2'
: 'p1';

}

sync();

render();

}

}

}

/* =====================================
SYNC
===================================== */

function sync(){

socket.emit(
"game-move",
{

roomId,
groupId,

state:
deep(state)

}
);

}

/* =====================================
SOCKET
===================================== */

socket.emit(
"join-room",
{

roomId,
groupId,
player

}
);

socket.on(
"player-joined",
()=>{

state.active = true;

setStatus(
"CONNECTED"
);

startVoice();

}
);

socket.on(
"game-move",
data=>{

if(
!validateState(
data.state
)
)return;

Object.assign(
state,
deep(data.state)
);

render();

if(state.winner){

popup(

state.winner === myRole
? "YOU WON"
: "YOU LOST",

"Game finished"

);

}

}
);

socket.on(
"player-disconnected",
()=>{

setStatus(
"OPPONENT DISCONNECTED"
);

popup(
"Disconnected",
"Opponent left"
);

}
);

socket.on(
"invalid-room",
()=>{

popup(
"Invalid Room",
"Room not found"
);

}
);

/* =====================================
VOICE
===================================== */

async function startVoice(){

try{

localStream =

await navigator
.mediaDevices
.getUserMedia({

audio:{

echoCancellation:true,
noiseSuppression:true,
autoGainControl:true

}

});

peer =
new RTCPeerConnection({

iceServers:[

{
urls:
"stun:stun.l.google.com:19302"
}

]

});

localStream
.getTracks()
.forEach(track=>{

peer.addTrack(
track,
localStream
);

});

peer.ontrack =
event=>{

remoteAudio.srcObject =
event.streams[0];

speakerBtn.classList.add(
'speaking'
);

};

peer.onicecandidate =
event=>{

if(event.candidate){

socket.emit(
"voice-signal",
{
roomId,
candidate:
event.candidate
}
);

}

};

if(player === 'p1'){

const offer =
await peer.createOffer();

await peer
.setLocalDescription(
offer
);

socket.emit(
"voice-signal",
{
roomId,
offer
}
);

}

}catch(err){

popup(
"Microphone Error",
"Microphone permission denied"
);

}

}

/* =====================================
VOICE SIGNAL
===================================== */

socket.on(
"voice-signal",
async data=>{

if(data.offer){

await peer
.setRemoteDescription(

new RTCSessionDescription(
data.offer
)

);

const answer =
await peer.createAnswer();

await peer
.setLocalDescription(
answer
);

socket.emit(
"voice-signal",
{
roomId,
answer
}
);

}

if(data.answer){

await peer
.setRemoteDescription(

new RTCSessionDescription(
data.answer
)

);

}

if(data.candidate){

try{

await peer
.addIceCandidate(

new RTCIceCandidate(
data.candidate
)

);

}catch(e){}

}

}
);

/* =====================================
MIC
===================================== */

micBtn.onclick = ()=>{

if(!localStream)
return;

micEnabled =
!micEnabled;

localStream
.getAudioTracks()
.forEach(track=>{

track.enabled =
micEnabled;

});

micBtn.innerText =

micEnabled
? "MIC ON"
: "MIC OFF";

};

/* =====================================
SPEAKER
===================================== */

speakerBtn.onclick = ()=>{

speakerEnabled =
!speakerEnabled;

remoteAudio.muted =
!speakerEnabled;

speakerBtn.innerText =

speakerEnabled
? "SPEAKER ON"
: "SPEAKER OFF";

};

/* =====================================
ONLINE OFFLINE
===================================== */

window.addEventListener(
'offline',
()=>{

setStatus(
"OFFLINE"
);

}
);

window.addEventListener(
'online',
()=>{

setStatus(
"ONLINE"
);

}
);

/* =====================================
START
===================================== */

render();

</script>

</body>
</html>
